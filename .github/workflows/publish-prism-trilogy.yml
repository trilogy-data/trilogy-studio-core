name: Publish Prism Trilogy Grammar

# Versioned independently of @trilogy-data/trilogy-studio-components: this is a
# standalone package meant to be consumed outside this repo, and its release
# cadence has nothing to do with the component library's.
#
# The studio build does NOT depend on this being published -- lib bundles the
# grammar from the local `link:` reference -- so a failure here never blocks a
# studio release.
on:
  push:
    branches:
      - main
    paths:
      - 'prism-trilogy/**'
      - '.github/workflows/publish-prism-trilogy.yml'
  # Escape hatch for the first publish and for re-runs.
  workflow_dispatch:

jobs:
  publish:
    environment: production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # OIDC / trusted publishing, matching publish-components.yml.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        working-directory: ./prism-trilogy
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: ./prism-trilogy
        run: pnpm typecheck

      # Gates the publish. The grammar is data with no integration surface, so
      # its tests are the only thing standing between a bad regex and every
      # consumer's syntax highlighting.
      - name: Test
        working-directory: ./prism-trilogy
        run: pnpm test

      - name: Build
        working-directory: ./prism-trilogy
        run: pnpm build

      - name: Check if version needs publishing
        id: version-check
        working-directory: ./prism-trilogy
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already published"
            echo "should-publish=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION not found, will publish"
            echo "should-publish=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.version-check.outputs.should-publish == 'true'
        working-directory: ./prism-trilogy
        run: npm publish
