[project]
name = "trilogy-remote-engine"
version = "0.1.0"
description = "Runs warehouse queries (Databricks) for the Trilogy studio, which the browser can't reach directly"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyarrow>=19",
    "pydantic>=2.0",
    "typing_extensions>=4.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
