[project]
name = "trilogy-studio-servers"
version = "0.1.0"
description = "A simple language service for Trilogy"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "efromvt" }]
license = { text = "MIT" }
dependencies = [
    # 0.3.335 is the floor for chart statements: ProcessedChartLayer only grew
    # `field_labels` (the `as` display names) there, and query_helpers reads it.
    "pytrilogy==0.3.337",
    "anyio>=4.5",
    "click>=8.1.0",
    "httpx>=0.27",
    # mcp_server.py targets the 2.x MCPServer API (mcp.server.fastmcp is gone).
    "mcp[cli]>=2,<3",
    "pydantic>=2.0",
    "pydantic-settings>=2.5.2",
    "sse-starlette>=1.6.1",
    "uvicorn>=0.23.1; sys_platform != 'emscripten'",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.8",
    "numpy>=2.2.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*", "numpy"]
ignore_missing_imports = true
